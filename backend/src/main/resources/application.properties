# =====================================================================
# GymSphere Backend Configuration
# =====================================================================
server.port=8080

# Spring Application Name
spring.application.name=gymsphere-backend

# MySQL Database DataSource Configuration
# Can be overridden by environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gymsphere_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=MySql@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
# update ensures missing tables or columns like trainers are created automatically while preserving data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging
logging.level.com.gymsphere=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
